name: Clearify
options:
  bundleIdPrefix: com.clearify
  deploymentTarget:
    iOS: 17.0
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.29.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  Clearify:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tuesday.clearify
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
        OTHER_SWIFT_FLAGS: "$(inherited) -DDEBUG"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          CLEARIFY_API_BASE_URL: http://127.0.0.1:5001/clearify-5414d/us-central1/api
        Release:
          CLEARIFY_API_BASE_URL: https://us-central1-clearify-5414d.cloudfunctions.net/api
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalyticsWithoutAdIdSupport
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: AuthenticationServices.framework
  ClearifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        TEST_TARGET_NAME: Clearify
        PRODUCT_BUNDLE_IDENTIFIER: com.tuesday.clearifyUITests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clearify
  ClearifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuesday.clearifyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clearify.app/Clearify"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: 5.10
    dependencies:
      - target: Clearify
