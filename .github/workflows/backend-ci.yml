name: Backend CI

on:
  push:
    paths:
      - "backend/functions/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/functions/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/functions/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
